appId: com.androidperformancestudio.desktop
productName: AndroidPerfermanceStudio

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# Phase 0 smoke builds only: no signing, no notarization, no publish.
# Reuse the Electron already installed by pnpm instead of downloading it again.
electronDist: node_modules/electron/dist
npmRebuild: false
publish: null

mac:
  target:
    - dmg
    - pkg
  category: public.app-category.developer-tools
  identity: null

win:
  target:
    - nsis
    - msi

linux:
  target:
    - deb
    - rpm
  category: Development
