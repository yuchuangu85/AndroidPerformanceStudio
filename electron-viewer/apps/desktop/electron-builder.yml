appId: com.androidperformancestudio.desktop
productName: AndroidPerfermanceStudio

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# Smoke builds only: no signing, no notarization, no publish. The six formats
# exist so the packaging path is exercised, not so anything is released.
npmRebuild: false
publish: null

# electron-builder copies out/ as it finds it; it never builds it. A stale out/
# is how a package that starts and then shows an empty window gets produced, and
# nothing about the package looks wrong afterwards. The hook refuses to pack a
# bundle older than the sources it came from, so the mistake fails here instead
# of in front of a user.
beforePack: ./scripts/check-build-freshness.mjs

# The resource names the application looks for at runtime. The package carries
# Perfetto UI, Trace Processor, and both offline user-documentation trees.
# Without them a package can pass a --dir smoke build by falling back to copies
# that only exist in a checkout.
mac:
  target:
    - dmg
    - pkg
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: null
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  extraResources:
    - from: ../../../third_party/perfetto/out/ui/dist
      to: perfetto-ui
    - from: ../../../build/perfetto-tools/trace_processor_shell
      to: perfetto-tools/trace_processor_shell
    - from: ../../../docs-user
      to: docs-user
    - from: ../../../docs-user-zh
      to: docs-user-zh
    - from: ../../../build/compose-agent
      to: compose-agent
    - from: ../../../third_party/firefox-profiler/dist
      to: firefox-profiler

win:
  target:
    - nsis
    - msi
  icon: build/icon.ico
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
  extraResources:
    - from: ../../../third_party/perfetto/out/ui/dist
      to: perfetto-ui
    # install-trace-processor.sh names the Windows download with its extension.
    - from: ../../../build/perfetto-tools/trace_processor_shell.exe
      to: perfetto-tools/trace_processor_shell.exe
    - from: ../../../docs-user
      to: docs-user
    - from: ../../../docs-user-zh
      to: docs-user-zh
    - from: ../../../build/compose-agent
      to: compose-agent
    - from: ../../../third_party/firefox-profiler/dist
      to: firefox-profiler

linux:
  target:
    - deb
    - rpm
  category: Development
  icon: build/icon.png
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  extraResources:
    - from: ../../../third_party/perfetto/out/ui/dist
      to: perfetto-ui
    - from: ../../../build/perfetto-tools/trace_processor_shell
      to: perfetto-tools/trace_processor_shell
    - from: ../../../docs-user
      to: docs-user
    - from: ../../../docs-user-zh
      to: docs-user-zh
    - from: ../../../build/compose-agent
      to: compose-agent
    - from: ../../../third_party/firefox-profiler/dist
      to: firefox-profiler
