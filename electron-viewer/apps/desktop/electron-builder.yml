appId: com.androidperformancestudio.desktop
productName: AndroidPerfermanceStudio

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# Phase 0 smoke builds only: no signing, no notarization, no publish.
# electron-builder downloads its own Electron; do not point electronDist at a
# pnpm-installed dist, which is absent on clean CI checkouts.
npmRebuild: false
publish: null

mac:
  target:
    - dmg
    - pkg
  category: public.app-category.developer-tools
  identity: null

win:
  target:
    - nsis
    - msi

linux:
  target:
    - deb
    - rpm
  category: Development
