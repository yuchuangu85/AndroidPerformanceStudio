name: AI platform qualification (nonpublishing)

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/ai-release/**'
      - 'scripts/ai-provider-acceptance.sh'
      - 'docs/ai/live-provider-acceptance.md'
      - 'desktop-viewer/ai-*/**'
      - 'desktop-viewer/desktop-app/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ai-release/**'
      - 'scripts/ai-provider-acceptance.sh'
      - 'docs/ai/live-provider-acceptance.md'
      - 'desktop-viewer/ai-*/**'
      - 'desktop-viewer/desktop-app/**'
  workflow_dispatch:
    inputs:
      run_real_provider:
        description: 'Opt in to billed real-provider acceptance; requires dedicated credentials'
        type: boolean
        default: false
      live_provider:
        description: 'Explicit provider; codex means Responses API, never CLI login'
        type: choice
        options: [openai, codex, claude]
      live_model:
        description: 'Exact model ID echoed by the provider; mandatory for a live run'
        type: string
      run_macos_sandbox:
        description: 'Require a real implemented macOS sandbox; unavailable is a failure'
        type: boolean
        default: false
      run_windows_sandbox:
        description: 'Require a real implemented Windows sandbox; unavailable is a failure'
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_real_provider:
        type: boolean
        default: false
      live_provider:
        type: string
        default: ''
      live_model:
        type: string
        default: ''
      run_macos_sandbox:
        type: boolean
        default: false
      run_windows_sandbox:
        type: boolean
        default: false
    secrets:
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  native:
    name: Native deterministic checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Deterministic release gate fixtures (never sign or contact providers)
        run: python scripts/ai-release/test_contracts.py
      - name: Independent AI platform and gateway
        shell: bash
        run: ./desktop-viewer/gradlew -p desktop-viewer :ai-platform:checkAll :ai-core:test --no-daemon
      - name: Desktop release contract
        shell: bash
        run: ./desktop-viewer/gradlew -p desktop-viewer :desktop-app:test --tests com.androidperformancestudio.desktop.AiReleaseQualificationTest --no-daemon

  linux-sandbox:
    name: Strict Linux native script qualification
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native isolation primitives (no weakened namespace policy)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux nodejs
          cc -O2 -Wall -Wextra -Werror desktop-viewer/ai-platform/ai-platform-script-runtime/src/main/native/linux/aps-script-sandbox.c -o "$RUNNER_TEMP/aps-script-sandbox"
          sudo install -D -m 0755 "$RUNNER_TEMP/aps-script-sandbox" /usr/libexec/aps/aps-script-sandbox
      - name: Require production sandbox execution and zero skipped tests
        env:
          APS_REQUIRE_NATIVE_SANDBOX: 'true'
          APS_REQUIRE_LINUX_SANDBOX: 'true'
        run: python scripts/ai-release/qualification.py native-sandbox

  macos-sandbox:
    name: Opt-in real macOS native sandbox
    if: ${{ github.event_name != 'pull_request' && inputs.run_macos_sandbox }}
    needs: native
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Require real native backend (no Linux substitution)
        env:
          APS_RUN_NATIVE_SANDBOX_ACCEPTANCE: 'true'
          APS_REQUIRE_NATIVE_SANDBOX: 'true'
        run: python scripts/ai-release/qualification.py native-sandbox

  windows-sandbox:
    name: Opt-in real Windows native sandbox
    if: ${{ github.event_name != 'pull_request' && inputs.run_windows_sandbox }}
    needs: native
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Require real native backend (no Linux substitution)
        env:
          APS_RUN_NATIVE_SANDBOX_ACCEPTANCE: 'true'
          APS_REQUIRE_NATIVE_SANDBOX: 'true'
        run: python scripts/ai-release/qualification.py native-sandbox

  real-provider:
    name: Opt-in ${{ inputs.live_provider }} acceptance (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' && inputs.run_real_provider }}
    needs: native
    environment: aps-ai-provider-acceptance
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Shared live harness prerequisites and exact zero-skip acceptance (Codex is Responses API)
        shell: bash
        env:
          APS_RUN_LIVE_PROVIDER: 'true'
          APS_LIVE_PROVIDER: ${{ inputs.live_provider }}
          APS_LIVE_MODEL: ${{ inputs.live_model }}
          OPENAI_API_KEY: ${{ (inputs.live_provider == 'openai' || inputs.live_provider == 'codex') && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.live_provider == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          set -euo pipefail
          bash scripts/ai-provider-acceptance.sh --check
          python scripts/ai-release/qualification.py real-provider

  qualification-result:
    name: Evidence boundary
    if: ${{ always() }}
    needs: [native, linux-sandbox, macos-sandbox, windows-sandbox, real-provider]
    runs-on: ubuntu-24.04
    steps:
      - name: Require requested gates; unrequested gates confer no qualification
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          LINUX_RESULT: ${{ needs.linux-sandbox.result }}
          MACOS_RESULT: ${{ needs.macos-sandbox.result }}
          WINDOWS_RESULT: ${{ needs.windows-sandbox.result }}
          PROVIDER_RESULT: ${{ needs.real-provider.result }}
          REQUEST_PROVIDER: ${{ inputs.run_real_provider }}
          REQUEST_MACOS: ${{ inputs.run_macos_sandbox }}
          REQUEST_WINDOWS: ${{ inputs.run_windows_sandbox }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_RESULT" == success && "$LINUX_RESULT" == success ]]
          if [[ "$REQUEST_PROVIDER" == true ]]; then [[ "$PROVIDER_RESULT" == success ]]; fi
          if [[ "$REQUEST_MACOS" == true ]]; then [[ "$MACOS_RESULT" == success ]]; fi
          if [[ "$REQUEST_WINDOWS" == true ]]; then [[ "$WINDOWS_RESULT" == success ]]; fi
          echo 'Nonpublishing checks only. Unrequested provider/native gates are NOT qualified. No signing or installer acceptance.' >> "$GITHUB_STEP_SUMMARY"
