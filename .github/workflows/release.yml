name: Release native installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      manual: ${{ steps.release.outputs.manual }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
      tag_exists: ${{ steps.release.outputs.tag_exists }}
    steps:
      - name: Validate version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw_version="${INPUT_VERSION}"
            manual=true
          else
            raw_version="${GITHUB_REF_NAME}"
            manual=false
          fi

          if [[ ! "${raw_version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use numeric semantic version format, for example v0.1.1."
            exit 1
          fi

          version="${raw_version#v}"
          tag="v${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "::error::Release tag does not match normalized version ${tag}."
            exit 1
          fi

          checkout_ref="${GITHUB_SHA}"
          tag_exists=false
          if [[ "$manual" == "false" ]]; then
            checkout_ref="refs/tags/${tag}"
            tag_exists=true
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            checkout_ref="refs/tags/${tag}"
            tag_exists=true
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "manual=${manual}" >> "${GITHUB_OUTPUT}"
          echo "checkout_ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"
          echo "tag_exists=${tag_exists}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts
      - name: Run tests
        run: ./desktop-viewer/gradlew -p desktop-viewer test --no-daemon

  prepare-release:
    name: Prepare draft GitHub Release
    needs: [resolve, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or reset draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          MANUAL: ${{ needs.resolve.outputs.manual }}
          TAG_EXISTS: ${{ needs.resolve.outputs.tag_exists }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --draft \
              --title "AndroidPerfermanceStudio $VERSION" \
              --repo "$GITHUB_REPOSITORY"
          elif [[ "$TAG_EXISTS" == "true" ]]; then
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "AndroidPerfermanceStudio $VERSION" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          elif [[ "$MANUAL" == "true" ]]; then
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "AndroidPerfermanceStudio $VERSION" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "::error::Tag $TAG was expected to exist for tag-triggered releases."
            exit 1
          fi

  package-windows:
    name: Package Windows x64 MSI and EXE
    needs: [resolve, test, prepare-release]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Build profiler assets
        shell: bash
        run: |
          npm install --global yarn@1
          ./scripts/firefox-profiler.sh all
          ./scripts/build-perfetto-ui.sh download
          PERFETTO_TOOLS_DIR="$PWD/build/perfetto-tools" ./scripts/install-trace-processor.sh
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts
      - name: Build MSI and EXE
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          & .\desktop-viewer\gradlew.bat -p desktop-viewer :desktop-app:packageMsi "-PappVersion=$version" -Ptarget.arch=x64 --no-daemon
          & .\desktop-viewer\gradlew.bat -p desktop-viewer :desktop-app:packageExe "-PappVersion=$version" -Ptarget.arch=x64 --no-daemon
      - name: Prepare Windows assets
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $msiPackages = @(Get-ChildItem "desktop-viewer\desktop-app\build\compose\binaries\main\msi\*.msi")
          if ($msiPackages.Count -ne 1) {
            throw "Expected exactly one MSI package, found $($msiPackages.Count)."
          }
          $exePackages = @(Get-ChildItem "desktop-viewer\desktop-app\build\compose\binaries\main\exe\*.exe")
          if ($exePackages.Count -ne 1) {
            throw "Expected exactly one EXE package, found $($exePackages.Count)."
          }
          $VERSION = $env:VERSION
          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          Copy-Item $msiPackages[0].FullName "release-assets\AndroidPerfermanceStudio-$VERSION-windows-x64.msi"
          Copy-Item $exePackages[0].FullName "release-assets\AndroidPerfermanceStudio-$VERSION-windows-x64.exe"
      - name: Upload Windows installers to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  package-macos:
    name: Package macOS ${{ matrix.arch }} DMG and PKG
    needs: [resolve, test, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Build profiler assets
        shell: bash
        run: |
          npm install --global yarn@1
          ./scripts/firefox-profiler.sh all
          ./scripts/build-perfetto-ui.sh download
          PERFETTO_TOOLS_DIR="$PWD/build/perfetto-tools" ./scripts/install-trace-processor.sh
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts
      - name: Verify macOS runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) actual_arch=arm64 ;;
            x86_64) actual_arch=x64 ;;
            *) echo "::error::Unsupported macOS runner architecture: $(uname -m)"; exit 1 ;;
          esac
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "::error::Expected $EXPECTED_ARCH runner, got $actual_arch."
            exit 1
          fi
      - name: Build DMG and PKG
        run: ./desktop-viewer/gradlew -p desktop-viewer :desktop-app:packageDmg :desktop-app:packagePkg -PappVersion=${{ needs.resolve.outputs.version }} -Ptarget.arch=${{ matrix.arch }} --no-daemon
      - name: Prepare macOS assets
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmg_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/dmg/*.dmg)
          if [[ "${#dmg_packages[@]}" -ne 1 || ! -f "${dmg_packages[0]}" ]]; then
            echo "::error::Expected exactly one DMG package."
            exit 1
          fi
          pkg_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/pkg/*.pkg)
          if [[ "${#pkg_packages[@]}" -ne 1 || ! -f "${pkg_packages[0]}" ]]; then
            echo "::error::Expected exactly one PKG package."
            exit 1
          fi
          mkdir -p release-assets
          cp "${dmg_packages[0]}" "release-assets/AndroidPerfermanceStudio-$VERSION-macos-$ARCH.dmg"
          cp "${pkg_packages[0]}" "release-assets/AndroidPerfermanceStudio-$VERSION-macos-$ARCH.pkg"
      - name: Upload macOS installers to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  package-linux:
    name: Package Linux x64 DEB and RPM
    needs: [resolve, test, prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Build profiler assets
        shell: bash
        run: |
          npm install --global yarn@1
          ./scripts/firefox-profiler.sh all
          ./scripts/build-perfetto-ui.sh download
          PERFETTO_TOOLS_DIR="$PWD/build/perfetto-tools" ./scripts/install-trace-processor.sh
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm
      - name: Build DEB and RPM
        run: ./desktop-viewer/gradlew -p desktop-viewer :desktop-app:packageDeb :desktop-app:packageRpm -PappVersion=${{ needs.resolve.outputs.version }} -Ptarget.arch=x64 --no-daemon
      - name: Prepare Linux assets
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          deb_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/deb/*.deb)
          if [[ "${#deb_packages[@]}" -ne 1 || ! -f "${deb_packages[0]}" ]]; then
            echo "::error::Expected exactly one DEB package."
            exit 1
          fi
          rpm_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/rpm/*.rpm)
          if [[ "${#rpm_packages[@]}" -ne 1 || ! -f "${rpm_packages[0]}" ]]; then
            echo "::error::Expected exactly one RPM package."
            exit 1
          fi
          mkdir -p release-assets
          cp "${deb_packages[0]}" "release-assets/AndroidPerfermanceStudio-$VERSION-linux-x64.deb"
          cp "${rpm_packages[0]}" "release-assets/AndroidPerfermanceStudio-$VERSION-linux-x64.rpm"
      - name: Upload Linux installers to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish GitHub Release
    needs: [resolve, test, prepare-release, package-windows, package-macos, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$TAG" --json assets,isDraft --repo "$GITHUB_REPOSITORY")"
          RELEASE_JSON="$release_json" python3 - <<'PY'
          import json
          import os
          import sys

          release = json.loads(os.environ["RELEASE_JSON"])
          expected = {
              f"AndroidPerfermanceStudio-{os.environ['VERSION']}-windows-x64.msi",
              f"AndroidPerfermanceStudio-{os.environ['VERSION']}-windows-x64.exe",
              f"AndroidPerfermanceStudio-{os.environ['VERSION']}-macos-arm64.dmg",
              f"AndroidPerfermanceStudio-{os.environ['VERSION']}-macos-arm64.pkg",
              f"AndroidPerfermanceStudio-{os.environ['VERSION']}-macos-x64.dmg",
              f"AndroidPerfermanceStudio-{os.environ['VERSION']}-macos-x64.pkg",
              f"AndroidPerfermanceStudio-{os.environ['VERSION']}-linux-x64.deb",
              f"AndroidPerfermanceStudio-{os.environ['VERSION']}-linux-x64.rpm",
          }
          actual = {asset["name"] for asset in release["assets"]}
          missing = sorted(expected - actual)
          extra = sorted(actual - expected)
          if missing or extra:
              print(f"::error::Release asset mismatch. Missing={missing} Extra={extra}")
              sys.exit(1)
          if not release["isDraft"]:
              print("::error::Release should remain draft until all assets are verified.")
              sys.exit(1)
          PY
          gh release edit "$TAG" \
            --draft=false \
            --latest \
            --title "AndroidPerfermanceStudio $VERSION" \
            --repo "$GITHUB_REPOSITORY"
