name: Release native installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      manual: ${{ steps.release.outputs.manual }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
    steps:
      - name: Validate version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw_version="${INPUT_VERSION}"
            manual=true
          else
            raw_version="${GITHUB_REF_NAME}"
            manual=false
          fi

          if [[ ! "${raw_version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use numeric semantic version format, for example v0.1.1."
            exit 1
          fi

          version="${raw_version#v}"
          tag="v${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "::error::Release tag does not match normalized version ${tag}."
            exit 1
          fi

          checkout_ref="${GITHUB_SHA}"
          if [[ "$manual" == "false" ]]; then
            checkout_ref="refs/tags/${tag}"
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            checkout_ref="refs/tags/${tag}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "manual=${manual}" >> "${GITHUB_OUTPUT}"
          echo "checkout_ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts
      - name: Run tests
        run: ./desktop-viewer/gradlew -p desktop-viewer test --no-daemon

  package-windows:
    name: Package Windows MSI and EXE
    needs: [resolve, test]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts
      - name: Build MSI and EXE
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          & .\desktop-viewer\gradlew.bat -p desktop-viewer :desktop-app:packageMsi "-PappVersion=$version" --no-daemon
          & .\desktop-viewer\gradlew.bat -p desktop-viewer :desktop-app:packageExe "-PappVersion=$version" --no-daemon
      - name: Prepare Windows assets
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $msiPackages = @(Get-ChildItem "desktop-viewer\desktop-app\build\compose\binaries\main\msi\*.msi")
          if ($msiPackages.Count -ne 1) {
            throw "Expected exactly one MSI package, found $($msiPackages.Count)."
          }
          $exePackages = @(Get-ChildItem "desktop-viewer\desktop-app\build\compose\binaries\main\exe\*.exe")
          if ($exePackages.Count -ne 1) {
            throw "Expected exactly one EXE package, found $($exePackages.Count)."
          }
          $VERSION = $env:VERSION
          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          Copy-Item $msiPackages[0].FullName "release-assets\AgentPerf-Inspector-$VERSION-windows-x64.msi"
          Copy-Item $exePackages[0].FullName "release-assets\AgentPerf-Inspector-$VERSION-windows-x64.exe"
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release-assets/AgentPerf-Inspector-${{ needs.resolve.outputs.version }}-windows-x64.msi
            release-assets/AgentPerf-Inspector-${{ needs.resolve.outputs.version }}-windows-x64.exe
          if-no-files-found: error

  package-macos:
    name: Package macOS DMG and PKG
    needs: [resolve, test]
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts
      - name: Build DMG and PKG
        run: ./desktop-viewer/gradlew -p desktop-viewer :desktop-app:packageDmg :desktop-app:packagePkg -PappVersion=${{ needs.resolve.outputs.version }} --no-daemon
      - name: Prepare macOS assets
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          dmg_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/dmg/*.dmg)
          if [[ "${#dmg_packages[@]}" -ne 1 || ! -f "${dmg_packages[0]}" ]]; then
            echo "::error::Expected exactly one DMG package."
            exit 1
          fi
          pkg_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/pkg/*.pkg)
          if [[ "${#pkg_packages[@]}" -ne 1 || ! -f "${pkg_packages[0]}" ]]; then
            echo "::error::Expected exactly one PKG package."
            exit 1
          fi
          mkdir -p release-assets
          cp "${dmg_packages[0]}" "release-assets/AgentPerf-Inspector-$VERSION-macos-x64.dmg"
          cp "${pkg_packages[0]}" "release-assets/AgentPerf-Inspector-$VERSION-macos-x64.pkg"
      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            release-assets/AgentPerf-Inspector-${{ needs.resolve.outputs.version }}-macos-x64.dmg
            release-assets/AgentPerf-Inspector-${{ needs.resolve.outputs.version }}-macos-x64.pkg
          if-no-files-found: error

  package-linux:
    name: Package Linux DEB and RPM
    needs: [resolve, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm
      - name: Build DEB and RPM
        run: ./desktop-viewer/gradlew -p desktop-viewer :desktop-app:packageDeb :desktop-app:packageRpm -PappVersion=${{ needs.resolve.outputs.version }} --no-daemon
      - name: Prepare Linux assets
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          deb_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/deb/*.deb)
          if [[ "${#deb_packages[@]}" -ne 1 || ! -f "${deb_packages[0]}" ]]; then
            echo "::error::Expected exactly one DEB package."
            exit 1
          fi
          rpm_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/rpm/*.rpm)
          if [[ "${#rpm_packages[@]}" -ne 1 || ! -f "${rpm_packages[0]}" ]]; then
            echo "::error::Expected exactly one RPM package."
            exit 1
          fi
          mkdir -p release-assets
          cp "${deb_packages[0]}" "release-assets/AgentPerf-Inspector-$VERSION-linux-x64.deb"
          cp "${rpm_packages[0]}" "release-assets/AgentPerf-Inspector-$VERSION-linux-x64.rpm"
      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            release-assets/AgentPerf-Inspector-${{ needs.resolve.outputs.version }}-linux-x64.deb
            release-assets/AgentPerf-Inspector-${{ needs.resolve.outputs.version }}-linux-x64.rpm
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [resolve, test, package-windows, package-macos, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          MANUAL: ${{ needs.resolve.outputs.manual }}
        run: |
          set -euo pipefail
          assets=(release-assets/*)
          if [[ "${#assets[@]}" -ne 6 ]]; then
            echo "::error::Expected exactly six native installer assets."
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          elif [[ "$MANUAL" == "true" ]]; then
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "AgentPerf Inspector $VERSION" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --title "AgentPerf Inspector $VERSION" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
