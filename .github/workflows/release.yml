name: Release native installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish, for example 0.1.1"
        required: true
        type: string
      release_qualified:
        description: "Explicitly request signed, notarized release qualification (never unsigned development publication)"
        type: boolean
        default: false
      run_real_provider:
        description: "Opt in to required billed real-provider acceptance for this exact source"
        type: boolean
        default: false
      live_provider:
        description: "Explicit live provider; codex means Responses API with OPENAI_API_KEY, not CLI login"
        type: choice
        options: [openai, codex, claude]
      live_model:
        description: "Exact model ID for one bounded synthetic request per native host"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Only canonical versions pass resolve; 1.2.3 and v1.2.3 share one workflow-wide lock.
  group: release-${{ github.repository }}-${{ startsWith(inputs.version || github.ref_name, 'v') && (inputs.version || github.ref_name) || format('v{0}', inputs.version || github.ref_name) }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      mode: ${{ steps.release.outputs.mode }}
      manual: ${{ steps.release.outputs.manual }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
      tag_exists: ${{ steps.release.outputs.tag_exists }}
    steps:
      - name: Validate version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_QUALIFIED: ${{ inputs.release_qualified }}
          INPUT_REAL_PROVIDER: ${{ inputs.run_real_provider }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Tag pushes publish unsigned development artifacts. Only an explicit manual dispatch
          # with release_qualified and run_real_provider opts into the signed, notarized release.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_RELEASE_QUALIFIED" != true || "$INPUT_REAL_PROVIDER" != true ]]; then
              echo "::error::Manual dispatch requires release_qualified=true and run_real_provider=true; unsigned development publication is tag-push only."
              exit 1
            fi
            mode=release
            raw_version="${INPUT_VERSION}"
            manual=true
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            mode=development
            raw_version="${GITHUB_REF_NAME}"
            manual=false
          else
            echo "::error::Unsupported release trigger ${GITHUB_EVENT_NAME}."
            exit 1
          fi

          if [[ ! "${raw_version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use numeric semantic version format, for example v0.1.1."
            exit 1
          fi

          version="${raw_version#v}"
          if [[ "${#version}" -gt 32 || "$version" =~ (^|\.)0[0-9]+(\.|$) ]]; then
            echo '::error::Version components must be canonical integers without leading zeroes.'
            exit 1
          fi
          tag="v${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "::error::Release tag does not match normalized version ${tag}."
            exit 1
          fi

          checkout_ref="${GITHUB_SHA}"
          tag_exists=false
          if [[ "$manual" == "false" ]]; then
            checkout_ref="refs/tags/${tag}"
            tag_exists=true
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            checkout_ref="refs/tags/${tag}"
            tag_exists=true
          fi
          if [[ "$tag_exists" == true ]]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo '::error::Existing tag differs from the dispatched source. Dispatch at the exact tag; old SHA evidence cannot qualify new source.'
              exit 1
            fi
          fi
          # All dependent jobs, including the reusable qualifier, must test immutable identical source.
          checkout_ref="$GITHUB_SHA"

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "mode=${mode}"
            echo "manual=${manual}"
            echo "checkout_ref=${checkout_ref}"
            echo "tag_exists=${tag_exists}"
          } >> "${GITHUB_OUTPUT}"

  ai-qualification:
    name: Required nonpublishing AI qualification
    if: needs.resolve.outputs.mode == 'release'
    needs: resolve
    uses: ./.github/workflows/ai-qualification.yml
    with:
      run_real_provider: true
      live_provider: ${{ inputs.live_provider }}
      live_model: ${{ inputs.live_model }}
    secrets:
      OPENAI_API_KEY: ${{ (inputs.live_provider == 'openai' || inputs.live_provider == 'codex') && secrets.OPENAI_API_KEY || '' }}
      ANTHROPIC_API_KEY: ${{ inputs.live_provider == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}

  test:
    name: Test
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.ai-qualification.result == 'success' || needs.ai-qualification.result == 'skipped') }}
    needs: [resolve, ai-qualification]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
          submodules: recursive
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up pinned npm
        run: npm install --global npm@11.17.0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts
      - name: Install pinned Trace Processor
        run: PERFETTO_TOOLS_DIR="$PWD/build/perfetto-tools" ./scripts/install-trace-processor.sh
      - name: Test application-managed ADB preparation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Set up pinned Rust 1.85.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup run 1.85.1 rustc --version
          echo "RUSTUP_TOOLCHAIN=1.85.1" >> "$GITHUB_ENV"
      - name: Test Rust HPROF integration
        run: ./desktop-viewer/gradlew -p desktop-viewer :memory-profiler:memory-app:test --no-daemon
      - name: Verify independent AI platform
        run: ./desktop-viewer/gradlew -p desktop-viewer :ai-platform:checkAll :ai-core:test --no-daemon
      - name: Run tests
        run: |
          ./desktop-viewer/gradlew -p desktop-viewer test --no-daemon

  build-compose-agent:
    name: Build verified Compose inspection runtime
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.test.result == 'success' }}
    needs: [resolve, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts
      - name: Install pinned Android agent build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          sdk_root="$RUNNER_TEMP/compose-agent-sdk"
          # Reuse the licenses already accepted by the hosted runner. An isolated SDK prevents
          # preinstalled platform, NDK or CMake versions from changing the selected toolchain.
          mkdir -p "$sdk_root/licenses"
          cp "$ANDROID_HOME/licenses/"* "$sdk_root/licenses/"
          "$sdkmanager" --sdk_root="$sdk_root" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - name: Build and verify Compose agent bundle
        run: ./desktop-viewer/gradlew -p desktop-viewer :layout-inspector:compose-agent-build:verifyComposeAgentBundle --no-configuration-cache --no-daemon
      - name: Share verified runtime with native packaging jobs
        uses: actions/upload-artifact@v7
        with:
          name: compose-agent-bundle
          path: desktop-viewer/layout-inspector/compose-agent-build/build/compose-agent-bundle
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  prepare-release:
    name: Check release source and refuse existing releases
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.test.result == 'success' }}
    needs: [resolve, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check target without creating or resetting a release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/ai-release/publication.py check --version "$VERSION" --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --repository "$GITHUB_REPOSITORY"

  package-windows:
    name: Package Windows x64 MSI and EXE
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.test.result == 'success' && needs['prepare-release'].result == 'success' && needs['build-compose-agent'].result == 'success' }}
    needs: [resolve, test, prepare-release, build-compose-agent]
    runs-on: windows-latest
    environment: aps-release-signing
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
          submodules: recursive
      - name: Download verified Compose inspection runtime
        uses: actions/download-artifact@v8
        with:
          name: compose-agent-bundle
          path: desktop-viewer/layout-inspector/compose-agent-build/build/compose-agent-bundle
          digest-mismatch: error
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Require Windows signing credential references
        if: needs.resolve.outputs.mode == 'release'
        env:
          APS_ENABLE_RELEASE_SIGNING: 'true'
          APS_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.APS_WINDOWS_CERTIFICATE_BASE64 }}
          APS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.APS_WINDOWS_CERTIFICATE_PASSWORD }}
          APS_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.APS_WINDOWS_CERTIFICATE_THUMBPRINT }}
          APS_WINDOWS_TIMESTAMP_URL: ${{ vars.APS_WINDOWS_TIMESTAMP_URL }}
        run: python scripts/ai-release/sign.py preflight windows
      - name: Set up pinned npm
        run: npm install --global npm@11.17.0
      - name: Build profiler assets
        shell: bash
        run: |
          npm install --global yarn@1
          ./scripts/firefox-profiler.sh all
          ./scripts/build-perfetto-ui.sh download
          PERFETTO_TOOLS_DIR="$PWD/build/perfetto-tools" ./scripts/install-trace-processor.sh
          python3 ./scripts/install-adb-tools.py --host windows-x64
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts
      - name: Install pinned Windows JBRSDK
        shell: pwsh
        run: ./scripts/install-jbr.ps1
      - name: Set up pinned Rust 1.85.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup run 1.85.1 rustc --version
          echo "RUSTUP_TOOLCHAIN=1.85.1" >> "$GITHUB_ENV"
      - name: Test Windows title bar on the packaged JBRSDK
        shell: pwsh
        env:
          APS_REQUIRE_JBR_CHROME: "true"
        run: |
          $env:JAVA_HOME = $env:APS_JBR_HOME
          & .\desktop-viewer\gradlew.bat -p desktop-viewer :desktop-app:test `
            "-Ptarget.javaHome=$env:APS_JBR_HOME" `
            "-Porg.gradle.java.installations.paths=$env:APS_JBR_HOME" `
            "-Porg.gradle.java.installations.auto-detect=false" `
            "-Porg.gradle.java.installations.auto-download=false" `
            --tests com.androidperformancestudio.desktop.JbrReleaseWorkflowTest `
            --tests com.androidperformancestudio.desktop.WindowsWindowChromeTest `
            --tests com.androidperformancestudio.desktop.WindowsWindowChromeIntegrationTest --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Windows JBRSDK title bar tests failed.' }
      - name: Verify bundled ADB without SDK or PATH
        shell: bash
        run: ./desktop-viewer/gradlew -p desktop-viewer :platform-core:adb-core:smokeBundledAdb --no-daemon
      - name: Build MSI and EXE
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          & .\desktop-viewer\gradlew.bat -p desktop-viewer :desktop-app:packageMsi "-PappVersion=$version" "-Ptarget.arch=x64" "-Ptarget.javaHome=$env:APS_JBR_HOME" --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Windows MSI packaging failed.' }
          & .\desktop-viewer\gradlew.bat -p desktop-viewer :desktop-app:packageExe "-PappVersion=$version" "-Ptarget.arch=x64" "-Ptarget.javaHome=$env:APS_JBR_HOME" --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Windows EXE packaging failed.' }
      - name: Prepare Windows assets
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $msiPackages = @(Get-ChildItem "desktop-viewer\desktop-app\build\compose\binaries\main\msi\*.msi")
          if ($msiPackages.Count -ne 1) {
            throw "Expected exactly one MSI package, found $($msiPackages.Count)."
          }
          $exePackages = @(Get-ChildItem "desktop-viewer\desktop-app\build\compose\binaries\main\exe\*.exe")
          if ($exePackages.Count -ne 1) {
            throw "Expected exactly one EXE package, found $($exePackages.Count)."
          }
          $VERSION = $env:VERSION
          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          Copy-Item $msiPackages[0].FullName "release-assets\AndroidPerfermanceStudio-$VERSION-windows-x64.msi"
          Copy-Item $exePackages[0].FullName "release-assets\AndroidPerfermanceStudio-$VERSION-windows-x64.exe"
      - name: Sign and verify Windows installers with timestamp
        if: needs.resolve.outputs.mode == 'release'
        shell: bash
        env:
          APS_ENABLE_RELEASE_SIGNING: 'true'
          APS_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.APS_WINDOWS_CERTIFICATE_BASE64 }}
          APS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.APS_WINDOWS_CERTIFICATE_PASSWORD }}
          APS_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.APS_WINDOWS_CERTIFICATE_THUMBPRINT }}
          APS_WINDOWS_TIMESTAMP_URL: ${{ vars.APS_WINDOWS_TIMESTAMP_URL }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/ai-release/sign.py sign windows --output release-assets --receipt release-evidence/windows-x64.json --version "$VERSION" --arch x64 --source-sha "$(git rev-parse HEAD)"
      - name: Seal source-bound Windows candidate receipt
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          MODE: ${{ needs.resolve.outputs.mode }}
        run: |
          set -euo pipefail
          args=(--platform windows --arch x64 --version "$VERSION" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --assets release-assets --candidate release-candidate)
          if [[ "$MODE" == "release" ]]; then
            python scripts/ai-release/sign.py verify windows --output release-assets --receipt release-evidence/windows-x64.json --version "$VERSION" --arch x64 --source-sha "$(git rev-parse HEAD)"
            args+=(--signing-receipt release-evidence/windows-x64.json)
          else
            args+=(--development)
          fi
          python scripts/ai-release/publication.py record "${args[@]}"
      - name: Preserve immutable Windows candidate and receipt in this run
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  package-macos:
    name: Package macOS ${{ matrix.arch }} DMG and PKG
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.test.result == 'success' && needs['prepare-release'].result == 'success' && needs['build-compose-agent'].result == 'success' }}
    needs: [resolve, test, prepare-release, build-compose-agent]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    environment: aps-release-signing
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
          submodules: recursive
      - name: Download verified Compose inspection runtime
        uses: actions/download-artifact@v8
        with:
          name: compose-agent-bundle
          path: desktop-viewer/layout-inspector/compose-agent-build/build/compose-agent-bundle
          digest-mismatch: error
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Require Developer ID and notarization credential references
        if: needs.resolve.outputs.mode == 'release'
        env:
          APS_ENABLE_RELEASE_SIGNING: 'true'
          APS_MACOS_CERTIFICATE_BASE64: ${{ secrets.APS_MACOS_CERTIFICATE_BASE64 }}
          APS_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APS_MACOS_CERTIFICATE_PASSWORD }}
          APS_MACOS_SIGNING_IDENTITY: ${{ secrets.APS_MACOS_SIGNING_IDENTITY }}
          APS_MACOS_INSTALLER_IDENTITY: ${{ secrets.APS_MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python scripts/ai-release/sign.py preflight macos
      - name: Set up pinned npm
        run: npm install --global npm@11.17.0
      - name: Build profiler assets
        shell: bash
        run: |
          npm install --global yarn@1
          ./scripts/firefox-profiler.sh all
          ./scripts/build-perfetto-ui.sh download
          PERFETTO_TOOLS_DIR="$PWD/build/perfetto-tools" ./scripts/install-trace-processor.sh
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts
      - name: Prepare application-managed macOS ADB
        run: python3 ./scripts/install-adb-tools.py --host macos-${{ matrix.arch }}
      - name: Verify macOS runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) actual_arch=arm64 ;;
            x86_64) actual_arch=x64 ;;
            *) echo "::error::Unsupported macOS runner architecture: $(uname -m)"; exit 1 ;;
          esac
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "::error::Expected $EXPECTED_ARCH runner, got $actual_arch."
            exit 1
          fi
      - name: Set up pinned Rust 1.85.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup run 1.85.1 rustc --version
          echo "RUSTUP_TOOLCHAIN=1.85.1" >> "$GITHUB_ENV"
      - name: Verify bundled ADB without SDK or PATH
        run: ./desktop-viewer/gradlew -p desktop-viewer :platform-core:adb-core:smokeBundledAdb --no-daemon
      - name: Build DMG and PKG
        run: ./desktop-viewer/gradlew -p desktop-viewer :desktop-app:packageDmg :desktop-app:packagePkg -PappVersion=${{ needs.resolve.outputs.version }} -Ptarget.arch=${{ matrix.arch }} --no-daemon
      - name: Prepare unsigned development macOS assets
        if: needs.resolve.outputs.mode == 'development'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmg_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/dmg/*.dmg)
          if [[ "${#dmg_packages[@]}" -ne 1 || ! -f "${dmg_packages[0]}" ]]; then
            echo "::error::Expected exactly one DMG package."
            exit 1
          fi
          pkg_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/pkg/*.pkg)
          if [[ "${#pkg_packages[@]}" -ne 1 || ! -f "${pkg_packages[0]}" ]]; then
            echo "::error::Expected exactly one PKG package."
            exit 1
          fi
          mkdir -p release-assets
          cp "${dmg_packages[0]}" "release-assets/AndroidPerfermanceStudio-$VERSION-macos-$ARCH.dmg"
          cp "${pkg_packages[0]}" "release-assets/AndroidPerfermanceStudio-$VERSION-macos-$ARCH.pkg"
      - name: Sign Developer ID app and notarize final macOS assets
        if: needs.resolve.outputs.mode == 'release'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
          APS_ENABLE_RELEASE_SIGNING: 'true'
          APS_MACOS_CERTIFICATE_BASE64: ${{ secrets.APS_MACOS_CERTIFICATE_BASE64 }}
          APS_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APS_MACOS_CERTIFICATE_PASSWORD }}
          APS_MACOS_SIGNING_IDENTITY: ${{ secrets.APS_MACOS_SIGNING_IDENTITY }}
          APS_MACOS_INSTALLER_IDENTITY: ${{ secrets.APS_MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          python scripts/ai-release/sign.py sign macos \
            --app desktop-viewer/desktop-app/build/compose/binaries/main/app/AndroidPerfermanceStudio.app \
            --output release-assets --receipt "release-evidence/macos-$ARCH.json" \
            --version "$VERSION" --arch "$ARCH" --source-sha "$(git rev-parse HEAD)"
          test -s "release-assets/AndroidPerfermanceStudio-$VERSION-macos-$ARCH.dmg"
          test -s "release-assets/AndroidPerfermanceStudio-$VERSION-macos-$ARCH.pkg"
      - name: Seal source-bound macOS candidate receipt
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
          MODE: ${{ needs.resolve.outputs.mode }}
        run: |
          set -euo pipefail
          args=(--platform macos --arch "$ARCH" --version "$VERSION" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --assets release-assets --candidate release-candidate)
          if [[ "$MODE" == "release" ]]; then
            python scripts/ai-release/sign.py verify macos --output release-assets --receipt "release-evidence/macos-$ARCH.json" --version "$VERSION" --arch "$ARCH" --source-sha "$(git rev-parse HEAD)"
            args+=(--signing-receipt "release-evidence/macos-$ARCH.json")
          else
            args+=(--development)
          fi
          python scripts/ai-release/publication.py record "${args[@]}"
      - name: Preserve immutable macOS candidate and receipt in this run
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-macos-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  package-linux:
    name: Package Linux ${{ matrix.arch }} DEB and RPM
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.test.result == 'success' && needs['prepare-release'].result == 'success' && needs['build-compose-agent'].result == 'success' }}
    needs: [resolve, test, prepare-release, build-compose-agent]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
          submodules: recursive
      - name: Download verified Compose inspection runtime
        uses: actions/download-artifact@v8
        with:
          name: compose-agent-bundle
          path: desktop-viewer/layout-inspector/compose-agent-build/build/compose-agent-bundle
          digest-mismatch: error
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up pinned npm
        run: npm install --global npm@11.17.0
      - name: Build profiler assets
        shell: bash
        run: |
          npm install --global yarn@1
          ./scripts/firefox-profiler.sh all
          ./scripts/build-perfetto-ui.sh download
          PERFETTO_TOOLS_DIR="$PWD/build/perfetto-tools" ./scripts/install-trace-processor.sh
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm
      - name: Prepare application-managed Linux ADB
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            sudo apt-get install -y adb patchelf
          fi
          python3 ./scripts/install-adb-tools.py --host linux-${{ matrix.arch }}
      - name: Set up pinned Rust 1.85.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup run 1.85.1 rustc --version
          echo "RUSTUP_TOOLCHAIN=1.85.1" >> "$GITHUB_ENV"
      - name: Verify bundled ADB without SDK or PATH
        run: ./desktop-viewer/gradlew -p desktop-viewer :platform-core:adb-core:smokeBundledAdb --no-daemon
      - name: Build DEB and RPM
        run: ./desktop-viewer/gradlew -p desktop-viewer :desktop-app:packageDeb :desktop-app:packageRpm -PappVersion=${{ needs.resolve.outputs.version }} -Ptarget.arch=${{ matrix.arch }} --no-daemon
      - name: Prepare Linux assets
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          deb_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/deb/*.deb)
          if [[ "${#deb_packages[@]}" -ne 1 || ! -f "${deb_packages[0]}" ]]; then
            echo "::error::Expected exactly one DEB package."
            exit 1
          fi
          rpm_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/rpm/*.rpm)
          if [[ "${#rpm_packages[@]}" -ne 1 || ! -f "${rpm_packages[0]}" ]]; then
            echo "::error::Expected exactly one RPM package."
            exit 1
          fi
          mkdir -p release-assets
          cp "${deb_packages[0]}" "release-assets/AndroidPerfermanceStudio-$VERSION-linux-$ARCH.deb"
          cp "${rpm_packages[0]}" "release-assets/AndroidPerfermanceStudio-$VERSION-linux-$ARCH.rpm"
      - name: Seal source-bound unsigned Linux candidate receipt
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
          MODE: ${{ needs.resolve.outputs.mode }}
        run: |
          set -euo pipefail
          args=(--platform linux --arch "$ARCH" --version "$VERSION" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --assets release-assets --candidate release-candidate)
          if [[ "$MODE" == "development" ]]; then
            args+=(--development)
          fi
          python scripts/ai-release/publication.py record "${args[@]}"
      - name: Preserve immutable Linux candidate and receipt in this run
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-linux-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.test.result == 'success' && needs['prepare-release'].result == 'success' && needs['package-windows'].result == 'success' && needs['package-macos'].result == 'success' && needs['package-linux'].result == 'success' }}
    needs: [resolve, test, prepare-release, package-windows, package-macos, package-linux]
    runs-on: ubuntu-latest
    environment: aps-release-signing
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download only this run and attempt's candidate receipts and bytes
        uses: actions/download-artifact@v8
        with:
          pattern: release-candidate-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-candidates
          merge-multiple: false
          digest-mismatch: error
      - name: Verify source tag receipts and uploaded bytes before publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          MODE: ${{ needs.resolve.outputs.mode }}
          APS_ENABLE_RELEASE_PUBLICATION: 'true'
        run: |
          set -euo pipefail
          args=(--version "$VERSION" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --repository "$GITHUB_REPOSITORY" --candidates release-candidates)
          if [[ "$MODE" == "development" ]]; then
            args+=(--development)
          fi
          python scripts/ai-release/publication.py publish "${args[@]}"
