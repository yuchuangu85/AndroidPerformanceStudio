name: APS Desktop Release

# Release packaging does not deny rustc warnings. The workspace still reports
# them in the build log, but a platform-specific unused or dead-code warning
# must not block a release; the lint gate belongs to a separate check.

on:
  push:
    tags:
      - "aps-desktop-v*"
      - "v*"

# A -rebuild.N tag suffix selects a new source commit without changing the
# application or installer version. Keep the full tag in artifact filenames.

permissions:
  contents: write

jobs:
  firefox-profiler:
    name: Build bundled Firefox Profiler
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build pinned Firefox Profiler
        run: |
          npm install --global yarn@1.22.22
          bash scripts/firefox-profiler.sh all
          test -s third_party/firefox-profiler/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-profiler-dist
          path: third_party/firefox-profiler/dist/
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: firefox-profiler
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          rustflags: ''
          target: ${{ matrix.target }}
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm cpio dpkg-dev binutils pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libvulkan-dev
      - name: Test Linux packaging contracts
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_linux_*.py' -v
      - name: Build binaries
        working-directory: rust-desktop
        run: cargo build --locked --release --target ${{ matrix.target }} -p aps-app -p aps-memory
      - name: Download bundled Firefox Profiler
        uses: actions/download-artifact@v4
        with:
          name: firefox-profiler-dist
          path: dist/firefox-profiler
      - name: Package deb and rpm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          umask 022
          version="${RELEASE_TAG#aps-desktop-v}"
          version="${version#rust-desktop-v}"; version="${version#v}"
          version="${version%-rebuild.*}"
          root="$PWD/dist/aps-desktop-${RELEASE_TAG}-linux-${DEB_ARCH}"
          libdir="$root/usr/lib/aps-desktop"
          mkdir -p "$libdir" "$root/usr/bin" "$root/usr/share/applications" "$root/usr/share/icons/hicolor/1024x1024/apps" "$PWD/dist/rpm/BUILD" "$PWD/dist/rpm/RPMS" "$PWD/dist/rpm/SOURCES" "$PWD/dist/rpm/SPECS" "$PWD/dist/rpm/SRPMS"
          cp "rust-desktop/target/${TARGET}/release/aps-app" "$libdir/aps-app"
          cp "rust-desktop/target/${TARGET}/release/aps-memory-worker" "$libdir/aps-memory-worker"
          chmod 0755 "$libdir/aps-app" "$libdir/aps-memory-worker"
          # The app resolves packaged tools next to its executable, so both
          # binaries live in /usr/lib/aps-desktop and /usr/bin only links to them.
          PERFETTO_TOOLS_DIR="$libdir/resources/perfetto-tools" bash scripts/install-trace-processor.sh
          chmod 0755 "$libdir/resources/perfetto-tools/trace_processor_shell"
          cp -R dist/firefox-profiler "$libdir/resources/"
          test -s "$libdir/resources/firefox-profiler/index.html"
          ln -s ../lib/aps-desktop/aps-app "$root/usr/bin/aps-app"
          ln -s ../lib/aps-desktop/aps-memory-worker "$root/usr/bin/aps-memory-worker"
          cp rust-desktop/crates/aps-app/assets/icons/linux/app-icon.png "$root/usr/share/icons/hicolor/1024x1024/apps/com.androidperformancestudio.rust.png"
          cat > "$root/usr/share/applications/com.androidperformancestudio.rust.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Android Performance Studio
          Exec=/usr/bin/aps-app
          Icon=com.androidperformancestudio.rust
          StartupWMClass=com.androidperformancestudio.rust
          Categories=Development;
          Terminal=false
          EOF
          mkdir -p "$root/DEBIAN"
          # Scan every shipped ELF; build-host libraries must not mask missing
          # dependency declarations in an installed package.
          dependency_root="$PWD/dist/deb-dependencies"
          mkdir -p "$dependency_root/debian"
          printf 'Source: aps-desktop\n\nPackage: aps-desktop\nArchitecture: any\nDescription: Android Performance Studio\n' > "$dependency_root/debian/control"
          dependency_output="$(cd "$dependency_root" && dpkg-shlibdeps -O "$libdir/aps-app" "$libdir/aps-memory-worker" "$libdir/resources/perfetto-tools/trace_processor_shell")"
          [[ "$dependency_output" == shlibs:Depends=* ]]
          shlib_dependencies="${dependency_output#shlibs:Depends=}"
          test -n "$shlib_dependencies"
          cat > "$root/DEBIAN/control" <<EOF
          Package: aps-desktop
          Version: ${version}
          Section: devel
          Priority: optional
          Architecture: ${DEB_ARCH}
          Depends: ${shlib_dependencies}, libvulkan1, libegl1, libwayland-client0, curl, xdg-utils
          Maintainer: Android Performance Studio
          Description: Android Performance Studio Rust desktop application
          EOF
          dpkg-deb --build --root-owner-group "$root" "dist/aps-desktop-${RELEASE_TAG}-linux-${DEB_ARCH}.deb"
          cp "$libdir/aps-app" "dist/rpm/SOURCES/aps-app"
          cp "$libdir/aps-memory-worker" "dist/rpm/SOURCES/aps-memory-worker"
          cp "$libdir/resources/perfetto-tools/trace_processor_shell" "dist/rpm/SOURCES/trace_processor_shell"
          cp -R "$libdir/resources/firefox-profiler" "dist/rpm/SOURCES/firefox-profiler"
          cp "$root/usr/share/icons/hicolor/1024x1024/apps/com.androidperformancestudio.rust.png" dist/rpm/SOURCES/app-icon.png
          cp "$root/usr/share/applications/com.androidperformancestudio.rust.desktop" dist/rpm/SOURCES/aps.desktop
          cat > dist/rpm/SPECS/aps-desktop.spec <<EOF
          Name: aps-desktop
          Version: ${version}
          Release: 1
          Summary: Android Performance Studio Rust desktop application
          License: Proprietary
          BuildArch: ${RPM_ARCH}
          Requires: libvulkan.so.1()(64bit), libEGL.so.1()(64bit), libwayland-client.so.0()(64bit), curl, xdg-utils
          %description
          Android Performance Studio Rust desktop application.
          %install
          mkdir -p %{buildroot}/usr/lib/aps-desktop/resources/perfetto-tools %{buildroot}/usr/bin %{buildroot}/usr/share/applications %{buildroot}/usr/share/icons/hicolor/1024x1024/apps
          install -m 0755 %{_sourcedir}/aps-app %{buildroot}/usr/lib/aps-desktop/aps-app
          install -m 0755 %{_sourcedir}/aps-memory-worker %{buildroot}/usr/lib/aps-desktop/aps-memory-worker
          install -m 0755 %{_sourcedir}/trace_processor_shell %{buildroot}/usr/lib/aps-desktop/resources/perfetto-tools/trace_processor_shell
          cp -R %{_sourcedir}/firefox-profiler %{buildroot}/usr/lib/aps-desktop/resources/
          ln -s ../lib/aps-desktop/aps-app %{buildroot}/usr/bin/aps-app
          ln -s ../lib/aps-desktop/aps-memory-worker %{buildroot}/usr/bin/aps-memory-worker
          install -m 0644 %{_sourcedir}/aps.desktop %{buildroot}/usr/share/applications/com.androidperformancestudio.rust.desktop
          install -m 0644 %{_sourcedir}/app-icon.png %{buildroot}/usr/share/icons/hicolor/1024x1024/apps/com.androidperformancestudio.rust.png
          %files
          /usr/bin/aps-app
          /usr/bin/aps-memory-worker
          /usr/lib/aps-desktop
          /usr/share/applications/com.androidperformancestudio.rust.desktop
          /usr/share/icons/hicolor/1024x1024/apps/com.androidperformancestudio.rust.png
          EOF
          rpmbuild --define "_topdir $PWD/dist/rpm" -bb dist/rpm/SPECS/aps-desktop.spec
          cp "dist/rpm/RPMS/${RPM_ARCH}/"*.rpm "dist/aps-desktop-${RELEASE_TAG}-linux-${RPM_ARCH}.rpm"
          readelf --version-info "$libdir/aps-app" "$libdir/aps-memory-worker" "$libdir/resources/perfetto-tools/trace_processor_shell" > "dist/linux-abi-${DEB_ARCH}.log"
          rpm -qp --requires "dist/aps-desktop-${RELEASE_TAG}-linux-${RPM_ARCH}.rpm" > "dist/linux-rpm-requires-${DEB_ARCH}.log"
      - name: Verify installed Linux packages as an ordinary user
        timeout-minutes: 15
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          set -euo pipefail
          root="$PWD/dist/aps-desktop-${RELEASE_TAG}-linux-${DEB_ARCH}"
          deb="$PWD/dist/aps-desktop-${RELEASE_TAG}-linux-${DEB_ARCH}.deb"
          rpm="$PWD/dist/aps-desktop-${RELEASE_TAG}-linux-${RPM_ARCH}.rpm"
          host_arch=arm64
          if [[ "$DEB_ARCH" == amd64 ]]; then host_arch=x64; fi
          checksum="$(python3 -c 'import json,sys; print(json.load(open("rust-desktop/assets/manifests/trace-processor-manifest.json"))["artifacts"]["linux-" + sys.argv[1]]["sha256"])' "$host_arch")"
          sudo apt-get install -y "$deb"
          trap 'sudo apt-get remove -y aps-desktop' EXIT
          bash scripts/linux/verify-installed.sh "$root" / "$checksum" 2>&1 | tee "dist/linux-deb-smoke-${DEB_ARCH}.log"
          sudo apt-get remove -y aps-desktop
          trap - EXIT
          test ! -e /usr/lib/aps-desktop
          test ! -L /usr/bin/aps-app
          test ! -L /usr/bin/aps-memory-worker
          # Resolve RPM dependencies in a real RPM distribution, not an Ubuntu
          # rpm database with dependency checks bypassed. No GPU/GUI claim.
          docker run --rm --mount "type=bind,src=$PWD,dst=/workspace,readonly" -w /workspace registry.fedoraproject.org/fedora:44 \
            bash -euc '
              dnf install -y "$1" binutils diffutils findutils shadow-utils util-linux
              useradd --no-create-home aps-smoke
              runuser -u aps-smoke -- bash scripts/linux/verify-installed.sh "$2" / "$3"
              dnf remove -y aps-desktop
              test ! -e /usr/lib/aps-desktop
              test ! -L /usr/bin/aps-app
              test ! -L /usr/bin/aps-memory-worker
            ' bash "/workspace/dist/$(basename "$rpm")" "/workspace/dist/$(basename "$root")" "$checksum" \
            2>&1 | tee "dist/linux-rpm-smoke-${DEB_ARCH}.log"
      - name: Upload Linux packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-packaging-evidence-${{ matrix.arch }}
          path: dist/linux-*.log
          if-no-files-found: ignore
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: firefox-profiler
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          rustflags: ''
          target: ${{ matrix.target }}
      - name: Prepare pinned macOS Trace Processor
        run: |
          set -euo pipefail
          tools="$PWD/dist/Android Performance Studio.app/Contents/MacOS/resources/perfetto-tools"
          PERFETTO_TOOLS_DIR="$tools" bash scripts/install-trace-processor.sh
          tool="$tools/trace_processor_shell"
          codesign --force --timestamp=none --sign - "$tool"
          codesign --verify --strict "$tool"
          # Signing changes the verified upstream bytes. Compile in the new hash
          # instead of allowing a mutable checksum file beside the executable.
          checksum="$(shasum -a 256 "$tool")"
          printf 'APS_MACOS_PACKAGED_TRACE_PROCESSOR_SHA256=%s\n' "${checksum%% *}" >> "$GITHUB_ENV"
      - name: Build binaries
        working-directory: rust-desktop
        run: cargo build --locked --release --target ${{ matrix.target }} -p aps-app -p aps-memory
      - name: Download bundled Firefox Profiler
        uses: actions/download-artifact@v4
        with:
          name: firefox-profiler-dist
          path: dist/Android Performance Studio.app/Contents/Resources/firefox-profiler
      - name: Package dmg and pkg
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          version="${RELEASE_TAG#aps-desktop-v}"
          version="${version#rust-desktop-v}"; version="${version#v}"
          version="${version%-rebuild.*}"
          app="dist/Android Performance Studio.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "rust-desktop/target/${TARGET}/release/aps-app" "$app/Contents/MacOS/aps-app"
          cp "rust-desktop/target/${TARGET}/release/aps-memory-worker" "$app/Contents/MacOS/aps-memory-worker"
          cp rust-desktop/crates/aps-app/Info.plist "$app/Contents/Info.plist"
          cp rust-desktop/crates/aps-app/assets/icons/macos/app-icon.icns "$app/Contents/Resources/app-icon.icns"
          test -s "$app/Contents/Resources/firefox-profiler/index.html"
          chmod 0755 "$app/Contents/MacOS/aps-app" "$app/Contents/MacOS/aps-memory-worker"
          # Ad-hoc sign the remaining nested code and the bundle last. Do not
          # re-sign Trace Processor: its bytes are pinned in the app. Signing the main
          # executable by path is not used: on an intel host codesign treats that
          # path as the bundle entry point and fails while any nested binary is
          # still unsigned. An unsigned bundle is reported as damaged and System
          # Settings offers no "Open Anyway"; an ad-hoc signature makes Gatekeeper
          # offer that choice. Real distribution still needs Developer ID signing
          # and notarization.
          codesign --force --timestamp=none --sign - "$app/Contents/MacOS/aps-memory-worker"
          codesign --force --timestamp=none --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          APS_TEST_PACKAGED_PERFETTO_RESOURCES="$PWD/$app/Contents/MacOS/resources" \
            cargo test --locked --release --target "$TARGET" --manifest-path rust-desktop/Cargo.toml \
            -p aps-perfetto --test pinned_tool signed_packaged_tool_opens_a_trace_and_rejects_modified_bytes -- --exact
          bash scripts/package-macos-dmg.sh "$app" "dist/aps-desktop-${RELEASE_TAG}-macos-${ARCH}.dmg"
          pkgbuild --component "$app" --install-location /Applications --version "$version" "dist/aps-desktop-${RELEASE_TAG}-macos-${ARCH}.pkg"
      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.pkg
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: firefox-profiler
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test Windows packaging contracts
        shell: pwsh
        run: |
          python -B -m unittest discover -s scripts/tests -p test_windows_packaging.py -v
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging regression tests failed" }
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          rustflags: ''
          target: x86_64-pc-windows-msvc
      - name: Build binaries
        working-directory: rust-desktop
        shell: pwsh
        env:
          # Target-only flags leave host proc macros/build scripts unchanged.
          # GPUI embeds release shaders; cc-based native libraries honor crt-static.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          # Cargo prioritizes these over target-specific flags, even when empty.
          Remove-Item Env:RUSTFLAGS, Env:CARGO_ENCODED_RUSTFLAGS -ErrorAction SilentlyContinue
          cargo build --locked --release --target x86_64-pc-windows-msvc -p aps-app -p aps-memory
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed: $LASTEXITCODE" }
      - name: Package Trace Processor
        shell: bash
        run: PERFETTO_TOOLS_DIR="$PWD/dist/resources/perfetto-tools" bash scripts/install-trace-processor.sh
      - name: Download bundled Firefox Profiler
        uses: actions/download-artifact@v4
        with:
          name: firefox-profiler-dist
          path: dist/resources/firefox-profiler
      - name: Install WiX
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "WiX installation failed: $LASTEXITCODE" }
      - name: Package portable ZIP and guided MSI
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/windows/package.ps1
      - name: Smoke test Windows install, repair and uninstall
        shell: pwsh
        timeout-minutes: 10
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/windows/smoke.ps1 -MsiPath "dist/aps-desktop-${env:RELEASE_TAG}-windows-x86_64.msi"
      - name: Upload Windows installer smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-smoke-logs
          path: dist/windows-smoke/*.log
          if-no-files-found: ignore
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows-x86_64
          path: |
            dist/aps-desktop-*-windows-x86_64.zip
            dist/*.msi
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: packages-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#aps-desktop-v}"
          version="${version#rust-desktop-v}"; version="${version#v}"
          version="${version%-rebuild.*}"
          title="AndroidPerfermanceStudio ${version}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            # Re-running a tag refreshes the packaged assets and keeps the
            # product-style release title instead of failing on the existing
            # release.
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
            gh release edit "${RELEASE_TAG}" --title "${title}"
          else
            gh release create "${RELEASE_TAG}" release-assets/* --generate-notes --title "${title}"
          fi
