name: Rust desktop architecture

on:
  pull_request:
    paths:
      - 'rust-desktop/**'
      - 'scripts/check_rust_architecture.py'
      - 'scripts/tests/test_rust_architecture.py'
      - '.github/workflows/rust-desktop-architecture.yml'
  push:
    branches: ['**']
    paths:
      - 'rust-desktop/**'
      - 'scripts/check_rust_architecture.py'
      - 'scripts/tests/test_rust_architecture.py'
      - '.github/workflows/rust-desktop-architecture.yml'

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    env:
      # Only reads dependency declarations, no resolution/build. Use the runner's installed Cargo.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Test boundary rules
        run: python3 -B -m unittest discover -s scripts/tests -p test_rust_architecture.py
      - name: Check workspace boundaries
        run: python3 -B scripts/check_rust_architecture.py
