name: Rust Desktop Release

# Release packaging does not deny rustc warnings. The workspace still reports
# them in the build log, but a platform-specific unused or dead-code warning
# must not block a release; the lint gate belongs to a separate check.

on:
  push:
    tags:
      - "rust-desktop-v*"
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          rustflags: ''
          target: ${{ matrix.target }}
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libvulkan-dev
      - name: Build binaries
        working-directory: rust-desktop
        run: cargo build --locked --release --target ${{ matrix.target }} -p aps-app -p aps-memory
      - name: Package deb and rpm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          version="${RELEASE_TAG#rust-desktop-v}"; version="${version#v}"
          root="$PWD/dist/aps-desktop-${RELEASE_TAG}-linux-${DEB_ARCH}"
          libdir="$root/usr/lib/aps-desktop"
          mkdir -p "$libdir" "$root/usr/bin" "$root/usr/share/applications" "$root/usr/share/icons/hicolor/1024x1024/apps" "$PWD/dist/rpm/BUILD" "$PWD/dist/rpm/RPMS" "$PWD/dist/rpm/SOURCES" "$PWD/dist/rpm/SPECS" "$PWD/dist/rpm/SRPMS"
          cp "rust-desktop/target/${TARGET}/release/aps-app" "$libdir/aps-app"
          cp "rust-desktop/target/${TARGET}/release/aps-memory-worker" "$libdir/aps-memory-worker"
          chmod 0755 "$libdir/aps-app" "$libdir/aps-memory-worker"
          # The app resolves packaged tools next to its executable, so both
          # binaries live in /usr/lib/aps-desktop and /usr/bin only links to them.
          PERFETTO_TOOLS_DIR="$libdir/resources/perfetto-tools" bash scripts/install-trace-processor.sh
          ln -s ../lib/aps-desktop/aps-app "$root/usr/bin/aps-app"
          ln -s ../lib/aps-desktop/aps-memory-worker "$root/usr/bin/aps-memory-worker"
          cp rust-desktop/crates/aps-app/assets/icons/linux/app-icon.png "$root/usr/share/icons/hicolor/1024x1024/apps/com.androidperformancestudio.rust.png"
          cat > "$root/usr/share/applications/com.androidperformancestudio.rust.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Android Performance Studio
          Exec=/usr/bin/aps-app
          Icon=com.androidperformancestudio.rust
          StartupWMClass=com.androidperformancestudio.rust
          Categories=Development;
          Terminal=false
          EOF
          mkdir -p "$root/DEBIAN"
          cat > "$root/DEBIAN/control" <<EOF
          Package: aps-desktop
          Version: ${version}
          Section: devel
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: Android Performance Studio
          Description: Android Performance Studio Rust desktop application
          EOF
          dpkg-deb --build --root-owner-group "$root" "dist/aps-desktop-${RELEASE_TAG}-linux-${DEB_ARCH}.deb"
          cp "$libdir/aps-app" "dist/rpm/SOURCES/aps-app"
          cp "$libdir/aps-memory-worker" "dist/rpm/SOURCES/aps-memory-worker"
          cp "$libdir/resources/perfetto-tools/trace_processor_shell" "dist/rpm/SOURCES/trace_processor_shell"
          cp "$root/usr/share/icons/hicolor/1024x1024/apps/com.androidperformancestudio.rust.png" dist/rpm/SOURCES/app-icon.png
          cp "$root/usr/share/applications/com.androidperformancestudio.rust.desktop" dist/rpm/SOURCES/aps.desktop
          cat > dist/rpm/SPECS/aps-desktop.spec <<EOF
          Name: aps-desktop
          Version: ${version}
          Release: 1
          Summary: Android Performance Studio Rust desktop application
          License: Proprietary
          BuildArch: ${RPM_ARCH}
          %description
          Android Performance Studio Rust desktop application.
          %install
          mkdir -p %{buildroot}/usr/lib/aps-desktop/resources/perfetto-tools %{buildroot}/usr/bin %{buildroot}/usr/share/applications %{buildroot}/usr/share/icons/hicolor/1024x1024/apps
          install -m 0755 %{_sourcedir}/aps-app %{buildroot}/usr/lib/aps-desktop/aps-app
          install -m 0755 %{_sourcedir}/aps-memory-worker %{buildroot}/usr/lib/aps-desktop/aps-memory-worker
          install -m 0755 %{_sourcedir}/trace_processor_shell %{buildroot}/usr/lib/aps-desktop/resources/perfetto-tools/trace_processor_shell
          ln -s ../lib/aps-desktop/aps-app %{buildroot}/usr/bin/aps-app
          ln -s ../lib/aps-desktop/aps-memory-worker %{buildroot}/usr/bin/aps-memory-worker
          install -m 0644 %{_sourcedir}/aps.desktop %{buildroot}/usr/share/applications/com.androidperformancestudio.rust.desktop
          install -m 0644 %{_sourcedir}/app-icon.png %{buildroot}/usr/share/icons/hicolor/1024x1024/apps/com.androidperformancestudio.rust.png
          %files
          /usr/bin/aps-app
          /usr/bin/aps-memory-worker
          /usr/lib/aps-desktop
          /usr/share/applications/com.androidperformancestudio.rust.desktop
          /usr/share/icons/hicolor/1024x1024/apps/com.androidperformancestudio.rust.png
          EOF
          rpmbuild --define "_topdir $PWD/dist/rpm" -bb dist/rpm/SPECS/aps-desktop.spec
          cp "dist/rpm/RPMS/${RPM_ARCH}/"*.rpm "dist/aps-desktop-${RELEASE_TAG}-linux-${RPM_ARCH}.rpm"
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          rustflags: ''
          target: ${{ matrix.target }}
      - name: Build binaries
        working-directory: rust-desktop
        run: cargo build --locked --release --target ${{ matrix.target }} -p aps-app -p aps-memory
      - name: Package dmg and pkg
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          version="${RELEASE_TAG#rust-desktop-v}"; version="${version#v}"
          app="dist/Android Performance Studio.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "rust-desktop/target/${TARGET}/release/aps-app" "$app/Contents/MacOS/aps-app"
          cp "rust-desktop/target/${TARGET}/release/aps-memory-worker" "$app/Contents/MacOS/aps-memory-worker"
          cp rust-desktop/crates/aps-app/Info.plist "$app/Contents/Info.plist"
          cp rust-desktop/crates/aps-app/assets/icons/macos/app-icon.icns "$app/Contents/Resources/app-icon.icns"
          chmod 0755 "$app/Contents/MacOS/aps-app" "$app/Contents/MacOS/aps-memory-worker"
          # The app resolves injected tools next to its executable, so the pinned
          # Trace Processor must live inside Contents/MacOS/resources.
          PERFETTO_TOOLS_DIR="$app/Contents/MacOS/resources/perfetto-tools" bash scripts/install-trace-processor.sh
          # Ad-hoc sign the nested executables and then the bundle. An unsigned
          # bundle is reported as damaged and System Settings offers no "Open
          # Anyway"; an ad-hoc signature makes Gatekeeper offer that choice.
          # Real distribution still needs Developer ID signing and notarization.
          codesign --force --timestamp=none --sign - "$app/Contents/MacOS/aps-memory-worker"
          codesign --force --timestamp=none --sign - "$app/Contents/MacOS/aps-app"
          codesign --force --timestamp=none --sign - "$app/Contents/MacOS/resources/perfetto-tools/trace_processor_shell"
          codesign --force --timestamp=none --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # A DMG needs the application plus an /Applications target so the user can
          # drag-install; a bundle alone in the volume gives no destination folder.
          stage="dist/dmg-${ARCH}"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Android Performance Studio" -srcfolder "$stage" -ov -format UDZO "dist/aps-desktop-${RELEASE_TAG}-macos-${ARCH}.dmg"
          pkgbuild --component "$app" --install-location /Applications --version "$version" "dist/aps-desktop-${RELEASE_TAG}-macos-${ARCH}.pkg"
      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.pkg
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          rustflags: ''
          target: x86_64-pc-windows-msvc
      - name: Build binaries
        working-directory: rust-desktop
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p aps-app -p aps-memory
      - name: Package Trace Processor
        shell: bash
        run: PERFETTO_TOOLS_DIR="$PWD/dist/resources/perfetto-tools" bash scripts/install-trace-processor.sh
      - name: Install WiX
        shell: pwsh
        run: choco install wixtoolset -y --no-progress
      - name: Package exe and msi
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^(rust-desktop-)?v', ''
          $parts = (($version -replace '[^0-9.]', '.') -split '\.' | Where-Object { $_ -ne '' } | Select-Object -First 3)
          while ($parts.Count -lt 3) { $parts += '0' }
          $msiVersion = $parts -join '.'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item rust-desktop/target/x86_64-pc-windows-msvc/release/aps-app.exe dist/aps-app.exe
          Copy-Item rust-desktop/target/x86_64-pc-windows-msvc/release/aps-memory-worker.exe dist/aps-memory-worker.exe
          Compress-Archive -Path dist/aps-app.exe, dist/aps-memory-worker.exe, dist/resources -DestinationPath "dist/aps-desktop-${env:RELEASE_TAG}-windows-x86_64.zip" -Force
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="Android Performance Studio" Language="1033" Version="$msiVersion" Manufacturer="Android Performance Studio" UpgradeCode="7D3A2A7A-48B6-4EF0-8D8D-5C9D1E7E8F21">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" Platform="x64" />
              <MajorUpgrade DowngradeErrorMessage="A newer version is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Icon Id="AppIcon" SourceFile="rust-desktop\crates\aps-app\assets\icons\windows\app-icon.ico" /><Property Id="ARPPRODUCTICON" Value="AppIcon" />
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFiles64Folder">
                  <Directory Id="INSTALLFOLDER" Name="Android Performance Studio" />
                </Directory>
              </Directory>
              <Feature Id="MainFeature" Title="Android Performance Studio" Level="1">
                <ComponentRef Id="AppComponent" />
                <ComponentRef Id="WorkerComponent" />
                <ComponentRef Id="TraceProcessorComponent" />
              </Feature>
            </Product>
            <Fragment>
              <Component Id="AppComponent" Directory="INSTALLFOLDER" Guid="*" Win64="yes">
                <File Id="AppFile" Source="dist\aps-app.exe" KeyPath="yes" />
              </Component>
              <Component Id="WorkerComponent" Directory="INSTALLFOLDER" Guid="*" Win64="yes">
                <File Id="WorkerFile" Source="dist\aps-memory-worker.exe" KeyPath="yes" />
              </Component>
              <DirectoryRef Id="INSTALLFOLDER">
                <Directory Id="ResourcesDir" Name="resources">
                  <Directory Id="PerfettoToolsDir" Name="perfetto-tools">
                    <Component Id="TraceProcessorComponent" Guid="*" Win64="yes">
                      <File Id="TraceProcessorFile" Source="dist\resources\perfetto-tools\trace_processor_shell.exe" KeyPath="yes" />
                    </Component>
                  </Directory>
                </Directory>
              </DirectoryRef>
            </Fragment>
          </Wix>
          "@ | Set-Content dist/aps-desktop.wxs
          & candle.exe -nologo dist/aps-desktop.wxs -out dist/aps-desktop.wixobj
          & light.exe -nologo -out "dist/aps-desktop-${env:RELEASE_TAG}-windows-x86_64.msi" dist/aps-desktop.wixobj
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/aps-desktop-*-windows-x86_64.zip
            dist/*.msi
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#rust-desktop-v}"; version="${version#v}"
          title="AndroidPerfermanceStudio ${version}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            # Re-running a tag refreshes the packaged assets and keeps the
            # product-style release title instead of failing on the existing
            # release.
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
            gh release edit "${RELEASE_TAG}" --title "${title}"
          else
            gh release create "${RELEASE_TAG}" release-assets/* --generate-notes --title "${title}"
          fi
