name: Electron

on:
  push:
    paths:
      - 'electron-viewer/**'
      - '.github/workflows/electron.yml'
  pull_request:
    paths:
      - 'electron-viewer/**'
      - '.github/workflows/electron.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, package smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron-viewer
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Package smoke (directory only, no publish)
        run: pnpm --filter @aps/desktop package:dir
