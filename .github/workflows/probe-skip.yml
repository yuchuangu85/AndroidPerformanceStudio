name: probe-skip
on:
  workflow_dispatch:
jobs:
  a:
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - run: echo a
  b:
    runs-on: ubuntu-latest
    needs: a
    if: ${{ !cancelled() && needs.a.result == 'skipped' }}
    steps:
      - run: echo b
  c:
    runs-on: ubuntu-latest
    needs: b
    steps:
      - run: echo c
  d:
    runs-on: ubuntu-latest
    needs: b
    if: ${{ !cancelled() && needs.b.result == 'success' }}
    steps:
      - run: echo d
