[package]
name = "aps-benchmark"
version = "0.8.1"
edition = "2024"
rust-version = "1.99"
publish = false

[[bin]]
name = "aps-benchmark"
path = "src/cli/main.rs"

[dependencies]
aps-json = { path = "../aps-json" }
aps-contracts = { path = "../aps-contracts" }
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled", "limits"] }
serde_json = { workspace = true }
