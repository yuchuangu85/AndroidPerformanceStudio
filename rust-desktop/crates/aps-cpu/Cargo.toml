[package]
name = "aps-cpu"
version = "0.8.1"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
aps-simpleperf-engine = { path = "../aps-simpleperf-engine" }
aps-json = { path = "../aps-json" }
aps-contracts = { path = "../aps-contracts" }
serde_json.workspace = true

[[bin]]
name = "aps-cpu-mcp"
path = "src/cpu_mcp/main.rs"

[dev-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
