[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
gpui-kit = "=0.9.0"
tree-sitter = "0.25"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-xml = "0.7.0"
aps-ui-foundation = { path = "crates/aps-ui-foundation" }
aps-cpu = { path = "crates/aps-cpu" }
aps-platform = { path = "crates/aps-platform" }
aps-adb = { path = "crates/aps-adb" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
