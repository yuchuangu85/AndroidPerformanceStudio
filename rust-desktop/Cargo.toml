[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
gpui-kit = "=0.9.0"
aps-ui-foundation = { path = "crates/aps-ui-foundation" }
aps-cpu = { path = "crates/aps-cpu" }
aps-platform = { path = "crates/aps-platform" }
aps-adb = { path = "crates/aps-adb" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
