syntax = "proto3";
package ui.inspector.view.inspector.protocol;
option java_package = "com.android.tools.ui.inspector.view.inspector.protocol";
option java_outer_classname = "ViewInspectorProtocol";

message Rect {
    int32 x = 1;
    int32 y = 2;
    int32 width = 3;
    int32 height = 4;
}


message ViewNode {
    // uniqueDrawingId of this view
    int64 id = 1;

    repeated ViewNode children = 2;

    // String table index for class name
    int32 class_name = 3;

    // String table index for package name
    int32 package_name = 4;

    // The absolute bounds of the view in screen coordinates.
    Rect bounds = 5;


    // String table index for the resource ID of the view (e.g., @id/my_view)
    int32 id_resource = 7;

    // String table index for the layout resource that inflated this view (e.g., @layout/activity_main)
    int32 layout_resource = 8;

    // Represents a key-value pair for a view property.
    message Attribute {
        // Index in the string table for the attribute name
        int32 name = 1;

        enum Type {
            UNSPECIFIED = 0;
            STRING = 1;
            BOOLEAN = 2;
            BYTE = 3;
            CHAR = 4;
            DOUBLE = 5;
            FLOAT = 6;
            INT16 = 7;
            INT32 = 8;
            INT64 = 9;
            OBJECT = 10;
            COLOR = 11;
            GRAVITY = 12;
            INT_ENUM = 13;
            INT_FLAG = 14;
            RESOURCE = 15;
            DRAWABLE = 16;
            ANIM = 17;
            ANIMATOR = 18;
            INTERPOLATOR = 19;
            DIMENSION = 20;
        }
        Type type = 2;

        oneof value {
            // string table index for STRING, raw value for INT32/BOOLEAN/COLOR
            int32 int32_value = 101;
            int64 int64_value = 102;
            double double_value = 103;
            float float_value = 104;
        }

        // String table indices for style resolution stack (e.g., [@style/MyStyle, @style/ParentStyle])
        repeated int32 style_chain = 3;
        // String table index for layout file or style where the value was explicitly set (e.g., @layout/activity_main or @style/MyStyle)
        int32 direct_source = 4;
    }

    // The list of resolved attributes for this view.
    repeated Attribute attributes = 9;
}

// Maps a string to a unique ID to optimize payload size.
message StringEntry {
    int32 id = 1;
    string value = 2;
}

// Locale information, corresponds to java.util.Locale
message Locale {
    int32 language = 1;
    int32 country = 2;
    int32 variant = 3;
    int32 script = 4;
}

// Screen size layout qualifier (e.g. normal, large).
enum ScreenLayoutSize {
    SCREEN_LAYOUT_SIZE_UNDEFINED = 0;
    SCREEN_LAYOUT_SIZE_SMALL = 1;
    SCREEN_LAYOUT_SIZE_NORMAL = 2;
    SCREEN_LAYOUT_SIZE_LARGE = 3;
    SCREEN_LAYOUT_SIZE_XLARGE = 4;
}

// Aspect ratio / longness layout qualifier (long, notlong).
enum ScreenLayoutLong {
    SCREEN_LAYOUT_LONG_UNDEFINED = 0;
    SCREEN_LAYOUT_LONG_NO = 1;
    SCREEN_LAYOUT_LONG_YES = 2;
}

// Layout direction qualifier (LTR, RTL).
enum LayoutDirection {
    LAYOUT_DIRECTION_UNDEFINED = 0;
    LAYOUT_DIRECTION_LTR = 1;
    LAYOUT_DIRECTION_RTL = 2;
}

// Screen shape qualifier (round, notround).
enum ScreenLayoutRound {
    SCREEN_LAYOUT_ROUND_UNDEFINED = 0;
    SCREEN_LAYOUT_ROUND_NO = 1;
    SCREEN_LAYOUT_ROUND_YES = 2;
}

// Wide color gamut capability qualifier.
enum ColorModeWideGamut {
    COLOR_MODE_WIDE_GAMUT_UNDEFINED = 0;
    COLOR_MODE_WIDE_GAMUT_NO = 1;
    COLOR_MODE_WIDE_GAMUT_YES = 2;
}

// High dynamic range capability qualifier.
enum ColorModeHdr {
    COLOR_MODE_HDR_UNDEFINED = 0;
    COLOR_MODE_HDR_NO = 1;
    COLOR_MODE_HDR_YES = 2;
}

// Touchscreen type qualifier.
enum TouchScreen {
    TOUCH_SCREEN_UNDEFINED = 0;
    TOUCH_SCREEN_NOTOUCH = 1;
    TOUCH_SCREEN_STYLUS = 2;
    TOUCH_SCREEN_FINGER = 3;
}

// Primary text input device / keyboard type qualifier.
enum Keyboard {
    KEYBOARD_UNDEFINED = 0;
    KEYBOARD_NOKEYS = 1;
    KEYBOARD_QWERTY = 2;
    KEYBOARD_12KEY = 3;
}

// State of the primary keyboard (hidden, visible).
enum KeyboardHidden {
    KEYBOARD_HIDDEN_UNDEFINED = 0;
    KEYBOARD_HIDDEN_NO = 1;
    KEYBOARD_HIDDEN_YES = 2;
}

// State of the hardware keyboard (hidden, visible).
enum HardKeyboardHidden {
    HARD_KEYBOARD_HIDDEN_UNDEFINED = 0;
    HARD_KEYBOARD_HIDDEN_NO = 1;
    HARD_KEYBOARD_HIDDEN_YES = 2;
}

// Primary navigation method qualifier (dpad, trackball, wheel, nonav).
enum Navigation {
    NAVIGATION_UNDEFINED = 0;
    NAVIGATION_NONAV = 1;
    NAVIGATION_DPAD = 2;
    NAVIGATION_TRACKBALL = 3;
    NAVIGATION_WHEEL = 4;
}

// State of the navigation controller (hidden, visible).
enum NavigationHidden {
    NAVIGATION_HIDDEN_UNDEFINED = 0;
    NAVIGATION_HIDDEN_NO = 1;
    NAVIGATION_HIDDEN_YES = 2;
}

// UI mode type qualifier (e.g. normal, desk, car, television, watch, vr).
enum UiModeType {
    UI_MODE_TYPE_UNDEFINED = 0;
    UI_MODE_TYPE_NORMAL = 1;
    UI_MODE_TYPE_DESK = 2;
    UI_MODE_TYPE_CAR = 3;
    UI_MODE_TYPE_TELEVISION = 4;
    UI_MODE_TYPE_APPLIANCE = 5;
    UI_MODE_TYPE_WATCH = 6;
    UI_MODE_TYPE_VR_HEADSET = 7;
}

// Night mode qualifier (yes, no).
enum UiModeNight {
    UI_MODE_NIGHT_UNDEFINED = 0;
    UI_MODE_NIGHT_NO = 1;
    UI_MODE_NIGHT_YES = 2;
}

// Screen orientation qualifier (portrait, landscape, square).
enum Orientation {
    ORIENTATION_UNDEFINED = 0;
    ORIENTATION_PORTRAIT = 1;
    ORIENTATION_LANDSCAPE = 2;
    ORIENTATION_SQUARE = 3;
}

// Grammatical gender system preference (neutral, feminine, masculine).
enum GrammaticalGender {
    GRAMMATICAL_GENDER_UNDEFINED = 0;
    GRAMMATICAL_GENDER_NEUTRAL = 1;
    GRAMMATICAL_GENDER_FEMININE = 2;
    GRAMMATICAL_GENDER_MASCULINE = 3;
}

// Device configuration, corresponds to a mapping of android.content.res.Configuration
message Configuration {
    float font_scale = 1;
    int32 country_code = 2;
    int32 network_code = 3;
    Locale locale = 4;
    ScreenLayoutSize screen_layout_size = 5;
    ScreenLayoutLong screen_layout_long = 6;
    LayoutDirection layout_direction = 7;
    ScreenLayoutRound screen_layout_round = 8;
    ColorModeWideGamut color_mode_wide_gamut = 9;
    ColorModeHdr color_mode_hdr = 10;
    TouchScreen touch_screen = 11;
    Keyboard keyboard = 12;
    KeyboardHidden keyboard_hidden = 13;
    HardKeyboardHidden hard_keyboard_hidden = 14;
    Navigation navigation = 15;
    NavigationHidden navigation_hidden = 16;
    UiModeType ui_mode_type = 17;
    UiModeNight ui_mode_night = 18;
    int32 smallest_screen_width_dp = 19;
    int32 density = 20;
    Orientation orientation = 21;
    int32 screen_width_dp = 22;
    int32 screen_height_dp = 23;
    GrammaticalGender grammatical_gender = 24;
}

message Display {
    int32 id = 1;
    // Physical width in pixels
    int32 width_px = 2;
    // Physical height in pixels
    int32 height_px = 3;
    // Display rotation in degrees: 0, 90, 180, 270
    int32 orientation = 4;
}

message AppContext {
    // String table index of the theme resource (e.g., "@style/Theme.AppCompat")
    int32 theme = 1;
    repeated Display display_info = 2;
}

// Command to dump the view hierarchy of all root views.
message DumpViewsCommand {
    bool include_attributes = 1;
    // Whether to include the style resolution stack and direct source for attributes.
    // Requires debug_view_attributes flag to be enabled on the device.
    bool include_resolution_stack = 2;
}

message DumpViewsResponse {
    // The flattened list of root views.
    repeated ViewNode nodes = 1;

    // Deduplicated strings referenced by indices in ViewNode.
    repeated StringEntry strings = 2;

    Configuration configuration = 3;

    AppContext app_context = 4;
}

message Command {
    oneof specialized {
        DumpViewsCommand dump_views_command = 1;
    }
}

message Response {
    oneof specialized {
        DumpViewsResponse dump_views_response = 1;
    }
}


